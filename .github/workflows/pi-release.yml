name: Build Atrium Raspberry Pi release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atrium-pi-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test backend
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v
          python -m compileall -q backend/atrium

      - name: WebSocket and SQLite integration smoke test
        env:
          ATRIUM_JWT_SECRET: ci-test-secret-never-use-in-production
          ATRIUM_DB_PATH: ${{ runner.temp }}/atrium-ci.sqlite3
          ATRIUM_HOST: 127.0.0.1
          ATRIUM_PORT: '8787'
        run: |
          PYTHONPATH=backend python -m atrium.main > /tmp/atrium-server.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" || true; cat /tmp/atrium-server.log' EXIT
          PYTHONPATH=backend python - <<'PY'
          import asyncio, base64, json
          from websockets.asyncio.client import connect

          async def smoke():
              for _ in range(30):
                  try:
                      async with connect("ws://127.0.0.1:8787/ws", open_timeout=2) as ws:
                          first = json.loads(base64.b64decode(await asyncio.wait_for(ws.recv(), 2)))
                          second = json.loads(await asyncio.wait_for(ws.recv(), 2))
                          assert first["type"] == "server.ready", first
                          assert second["type"] == "identity.required", second
                          def encode(message):
                              return base64.b64encode(json.dumps(message).encode()).decode()
                          async def recv():
                              return json.loads(base64.b64decode(await asyncio.wait_for(ws.recv(), 3)))
                          await ws.send(encode({"type": "spaces.list"}))
                          spaces = await recv()
                          assert spaces["type"] == "spaces.list", spaces
                          await ws.send(encode({"type": "auth.register",
                              "name": "CiPlayer", "email": "ci-player@example.invalid",
                              "password": "test-password-123"}))
                          auth = await recv()
                          assert auth["type"] == "auth.accepted", auth
                          await ws.send(encode({"type": "space.create", "space": "ci-room"}))
                          created = await recv()
                          assert created["type"] == "space.created", created
                          await ws.send(encode({"type": "space.join", "space": "ci-room"}))
                          joined = await recv()
                          assert joined["type"] == "space.joined", joined
                          return
                  except (OSError, TimeoutError):
                      await asyncio.sleep(.2)
              raise AssertionError("Atrium server never became ready")

          asyncio.run(smoke())
          PY

      - name: Assemble Raspberry Pi release
        run: |
          mkdir -p package/frontend package/deploy
          cp -a backend package/backend
          cp -a frontend/dist package/frontend/dist
          cp -a deploy/pi package/deploy/pi
          tar -C package -czf atrium-pi.tar.gz .
          sha256sum atrium-pi.tar.gz > atrium-pi.tar.gz.sha256

      - name: Confirm commit is still main
        id: head
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release for Pi auto-update
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pi-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" atrium-pi.tar.gz atrium-pi.tar.gz.sha256 \
              --target "$GITHUB_SHA" \
              --title "Atrium Pi $GITHUB_SHA" \
              --notes "Tested Atrium backend and prebuilt frontend for Raspberry Pi Zero W." \
              --latest
          fi
