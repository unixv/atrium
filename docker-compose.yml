services:
  server:
    build: ./backend
    environment:
      ATRIUM_HOST: 0.0.0.0
      ATRIUM_PORT: 8787
      ATRIUM_LOG_LEVEL: DEBUG
      ATRIUM_MAX_MESSAGE_SIZE: 4096
      ATRIUM_DB_PATH: /data/atrium.sqlite3
      ATRIUM_JWT_SECRET: dev-secret-change-before-public-deployment
    ports:
      - "8787:8787"
    volumes:
      - atrium-data:/data

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  atrium-data:
